[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dust2-igl-foundation"
version = "0.1.0"
description = "Reproducible Counter-Strike data, replay and simulation foundation; no training"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
igl = "igl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: uses downloaded corpus or DECOY assets"]
